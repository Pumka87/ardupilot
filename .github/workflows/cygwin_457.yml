name: Cygwin Build Plane 4.5.7 FlightAxis Patched

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      # Берём строго официальный Plane-4.5.7
      - name: Checkout Plane-4.5.7
        uses: actions/checkout@v4
        with:
          ref: Plane-4.5.7
          submodules: recursive
          fetch-depth: 0

      # Compatibility patch:
      # переносим только обработку нулевых servo outputs
      # из нового SIM_FlightAxis в Plane 4.5.7.
      - name: Patch FlightAxis diagnostics
        shell: pwsh
        run: |
          $path = "libraries/SITL/SIM_FlightAxis.cpp"

          $text = [System.IO.File]::ReadAllText($path)
          $text = $text.Replace("`r`n", "`n")

          $old = @'
          void FlightAxis::exchange_data(const struct sitl_input &input)
          {
            if (!sock &&
          '@

          $new = @'
          void FlightAxis::exchange_data(const struct sitl_input &input)
          {
            static uint16_t servo_debug_counter;

            if (++servo_debug_counter >= 50) {
              servo_debug_counter = 0;

              printf("FA_SERVO: %u %u %u %u\n",
               unsigned(input.servos[0]),
               unsigned(input.servos[1]),
               unsigned(input.servos[2]),
               unsigned(input.servos[3]));
            }

            if (!sock &&
          '@

          if (-not $text.Contains($old)) {
              throw "FlightAxis diagnostic patch FAILED: target block not found."
          }

          $text = $text.Replace($old, $new)

          [System.IO.File]::WriteAllText(
              $path,
              $text,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "=== FlightAxis diagnostic patch applied ==="
          git diff -- libraries/SITL/SIM_FlightAxis.cpp

      # Та же Cygwin/Python 3.9 среда, на которой
      # у вас уже успешно собралась Plane 4.5.7.
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: C:\cygwin
          packages: >-
            cygwin64
            gcc-g++=10.2.0-1
            python39
            python39-pip
            python39-future
            python39-lxml
            python39-setuptools
            python39-wheel
            python39-pexpect
            git
            procps
            gettext
          add-to-path: false

      - name: Prepare Python environment
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          ln -sf /usr/bin/python3.9.exe /usr/bin/python &&
          ln -sf /usr/bin/pip3.9.exe /usr/bin/pip &&
          python --version &&
          python -m pip --version &&
          python -c "import future; print('future OK')" &&
          python -c "import lxml; print('lxml OK')" &&
          python -m pip install --progress-bar off empy==3.3.4 &&
          python -m pip install --progress-bar off dronecan==1.0.26

      - name: Verify Plane source
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          CYGPATH_GITHUB_WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE") &&
          git config --global --add safe.directory "${CYGPATH_GITHUB_WORKSPACE}" &&
          git describe --tags --always &&
          git log -1 --oneline &&
          git diff -- libraries/SITL/SIM_FlightAxis.cpp

      - name: Configure Plane SITL
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          export PATH=/usr/bin:$(cygpath ${SYSTEMROOT})/system32 &&
          python ./waf
          --color yes
          --toolchain x86_64-pc-cygwin
          --board sitl
          configure

      - name: Build ArduPlane
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          export PATH=/usr/bin:$(cygpath ${SYSTEMROOT})/system32 &&
          python ./waf plane

      - name: Prepare artifacts
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          rm -rf artifacts &&
          mkdir artifacts &&
          cp -v build/sitl/bin/arduplane artifacts/ArduPlane.elf.exe &&
          cp -v build/sitl/bin/arduplane artifacts/ArduPlane.elf &&
          for dll in $(cygcheck artifacts/ArduPlane.elf.exe |
          grep -oP 'cyg[^\s\\/]+\.dll' |
          sort -u);
          do cp -v "/usr/bin/$dll" artifacts/;
          done &&
          git describe --tags --always > artifacts/version.txt &&
          git log -1 > artifacts/git.txt &&
          git diff -- libraries/SITL/SIM_FlightAxis.cpp > artifacts/flightaxis_patch.diff &&
          ls -la artifacts

      - name: Upload Plane 4.5.7 binaries
        uses: actions/upload-artifact@v4
        with:
          name: Plane-4.5.7-Cygwin-SITL-FlightAxis-Patched
          path: artifacts
          retention-days: 7
