name: Cygwin Build Plane 4.5.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Рекомендация cygwin-install-action:
      # не checkout'ить shell-скрипты с CRLF.
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      # Сам workflow живёт в master вашего fork,
      # но собираем строго официальный тег Plane-4.5.7.
      - name: Checkout Plane-4.5.7
        uses: actions/checkout@v7
        with:
          ref: Plane-4.5.7
          submodules: recursive
          fetch-depth: 0

      # Пакеты взяты из актуального официального
      # Cygwin workflow ArduPilot.
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: C:\cygwin
          packages: cygwin64 gcc-g++=13.4.0-1 python312 python312-pip git procps gettext
          add-to-path: false

      # ВАЖНО: здесь и ниже run: >-, а не run: |
      # Это предотвращает CRLF в скрипте Cygwin.
      - name: Prepare Python environment
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          python3 --version &&
          python3 -m pip --version &&
          python3 -m pip install --progress-bar off
          empy==3.3.4
          pexpect
          future
          lxml
          setuptools
          wheel &&
          python3 -m pip install --progress-bar off dronecan --upgrade

      - name: Verify source version
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          CYGPATH_GITHUB_WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE") &&
          git config --global --add safe.directory "${CYGPATH_GITHUB_WORKSPACE}" &&
          git describe --tags --always &&
          git log -1 --oneline

      - name: Configure Plane SITL
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          CYGPATH_GITHUB_WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE") &&
          git config --global --add safe.directory "${CYGPATH_GITHUB_WORKSPACE}" &&
          export PATH=/usr/bin:$(cygpath ${SYSTEMROOT})/system32 &&
          python3 ./waf --color yes --toolchain x86_64-pc-cygwin --board sitl configure

      - name: Build ArduPlane
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          export PATH=/usr/bin:$(cygpath ${SYSTEMROOT})/system32 &&
          python3 ./waf plane

      - name: Prepare artifacts
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          rm -rf artifacts &&
          mkdir artifacts &&
          ls -la build/sitl/bin &&
          cp -v build/sitl/bin/arduplane artifacts/ArduPlane.elf.exe &&
          git describe --tags --always > artifacts/version.txt &&
          git log -1 > artifacts/git.txt &&
          cygcheck artifacts/ArduPlane.elf.exe > artifacts/cygcheck.txt &&
          for dll in $(cygcheck artifacts/ArduPlane.elf.exe | grep -oP 'cyg[^\s\\/]+\.dll' | sort -u); do cp -v "/usr/bin/$dll" artifacts/; done &&
          ls -la artifacts

      - name: Upload Plane 4.5.7 binaries
        uses: actions/upload-artifact@v7
        with:
          name: Plane-4.5.7-Cygwin-SITL
          path: artifacts
          retention-days: 7
