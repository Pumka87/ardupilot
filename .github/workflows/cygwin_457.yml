name: Cygwin Build Plane 4.5.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: runs-on: windows-2022

    steps:
      # Берём исходники именно ArduPlane 4.5.7,
      # независимо от того, на какой ветке лежит этот workflow.
      - name: Checkout Plane-4.5.7
        uses: actions/checkout@v4
        with:
          ref: Plane-4.5.7
          submodules: recursive
          fetch-depth: 0

      # Устанавливаем Cygwin.
      # GCC 10.2 — тот же, который использовался
      # оригинальным workflow ArduPilot 4.5.7.
      # Python берём современный, т.к. Python 3.7
      # из текущего Cygwin уже фактически недоступен.
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: C:\cygwin
          packages: >-
            cygwin64
            gcc-g++=10.2.0-1
            python312
            python312-pip
            git
            procps
            gettext
          add-to-path: false

      # Проверяем Python и ставим Python-зависимости,
      # необходимые старому waf/ArduPilot.
      - name: Prepare Python environment
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          python3 --version
          python3 -m pip --version

          python3 -m pip install --progress-bar off \
            empy==3.3.4 \
            pexpect \
            future \
            lxml \
            setuptools \
            wheel

          python3 -m pip install --progress-bar off \
            dronecan

      # Компилируем только Plane, остальные аппараты нам не нужны.
      - name: Build Plane SITL
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          export PATH=/usr/local/bin:/usr/bin:$(cygpath ${SYSTEMROOT})/system32

          WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          git config --global --add safe.directory "$WORKSPACE"

          echo "=== Git version ==="
          git describe --tags --always
          git log -1 --oneline

          echo "=== Compiler ==="
          x86_64-pc-cygwin-g++ --version

          echo "=== Configure SITL ==="
          python3 ./waf \
            --color yes \
            --toolchain x86_64-pc-cygwin \
            --board sitl \
            configure

          echo "=== Build ArduPlane ==="
          python3 ./waf plane

      # Собираем ArduPlane.exe и нужные ему Cygwin DLL
      # в отдельную папку.
      - name: Prepare artifacts
        env:
          PATH: /usr/bin:$(cygpath ${SYSTEMROOT})/system32
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          echo "=== Build directory ==="
          ls -la build/sitl/bin/

          echo "=== Copy ArduPlane ==="
          cp -v \
            build/sitl/bin/arduplane \
            artifacts/ArduPlane.elf.exe

          # Сохраним информацию о точной версии исходников.
          git log -1 > artifacts/git.txt

          echo "=== Required Cygwin DLLs ==="

          cygcheck artifacts/ArduPlane.elf.exe || true

          cygcheck artifacts/ArduPlane.elf.exe \
            | grep -oP 'cyg[^\s\\/]+\.dll' \
            | sort -u \
            | while read -r dll; do
                echo "Copying $dll"
                cp -v "/usr/bin/$dll" artifacts/
              done

          echo "=== Final artifact contents ==="
          ls -la artifacts/

      - name: Upload Plane 4.5.7 binaries
        uses: actions/upload-artifact@v4
        with:
          name: Plane-4.5.7-Cygwin-SITL
          path: artifacts
          retention-days: 7
