name: Cygwin Build Plane 4.5.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Workflow находится в master вашего fork,
      # но исходники собираются строго из тега Plane-4.5.7.
      - name: Checkout Plane-4.5.7
        uses: actions/checkout@v7
        with:
          ref: Plane-4.5.7
          submodules: recursive
          fetch-depth: 0

      # Используем актуальную Cygwin-конфигурацию из текущего
      # официального workflow ArduPilot.
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: >-
            cygwin64
            gcc-g++=13.4.0-1
            python312
            python312-pip
            git
            procps
            gettext
          add-to-path: false

      - name: Check Cygwin environment
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          echo "=== Cygwin ==="
          uname -a

          echo "=== Python executable ==="
          ls -l /usr/bin/python3.12.exe
          /usr/bin/python3.12.exe --version

          echo "=== Pip ==="
          /usr/bin/python3.12.exe -m pip --version

          echo "=== Compiler ==="
          /usr/bin/x86_64-pc-cygwin-g++ --version

      # Это те же Python-пакеты, которые ставит текущий
      # официальный Cygwin workflow ArduPilot.
      - name: Prepare Python environment
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          /usr/bin/python3.12.exe -m pip install \
            --progress-bar off \
            empy==3.3.4 \
            pexpect

          /usr/bin/python3.12.exe -m pip install \
            --progress-bar off \
            --upgrade \
            dronecan

      - name: Show source version
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory "$WORKSPACE"

          echo "=== Checked out revision ==="
          git describe --tags --always
          git log -1 --oneline

      # Сборка Plane SITL непосредственно через waf.
      # Не используем старый CI-wrapper и ccache: для одной
      # диагностической сборки они не нужны.
      - name: Configure Plane SITL
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          export PATH="/usr/bin:$(cygpath "$SYSTEMROOT")/system32"

          /usr/bin/python3.12.exe ./waf \
            --color yes \
            --toolchain x86_64-pc-cygwin \
            --board sitl \
            configure

      - name: Build ArduPlane
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          export PATH="/usr/bin:$(cygpath "$SYSTEMROOT")/system32"

          /usr/bin/python3.12.exe ./waf plane

      # Сначала специально выводим содержимое build/sitl/bin,
      # чтобы в случае отличия имени старого бинарника это было
      # сразу видно в логе.
      - name: Collect binaries
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          echo "=== build/sitl/bin contents ==="
          ls -lah build/sitl/bin

          if [ -f build/sitl/bin/arduplane ]; then
              PLANE_BIN="build/sitl/bin/arduplane"
          elif [ -f build/sitl/bin/arduplane.exe ]; then
              PLANE_BIN="build/sitl/bin/arduplane.exe"
          else
              echo "ERROR: ArduPlane executable not found"
              find build -maxdepth 4 -type f \
                \( -iname '*arduplane*' -o -iname '*plane*.exe' \) \
                -print
              exit 1
          fi

          echo "Using: $PLANE_BIN"

          cp -v "$PLANE_BIN" artifacts/ArduPlane.elf.exe

          git describe --tags --always > artifacts/version.txt
          git log -1 > artifacts/git.txt

          echo "=== Cygwin DLL dependencies ==="
          cygcheck artifacts/ArduPlane.elf.exe || true

          cygcheck artifacts/ArduPlane.elf.exe \
            | grep -oE 'cyg[^ /\\]+\.dll' \
            | sort -u \
            | while read -r dll; do
                if [ -f "/usr/bin/$dll" ]; then
                    cp -v "/usr/bin/$dll" artifacts/
                fi
              done

          echo "=== Artifact contents ==="
          ls -lah artifacts

      - name: Upload Plane 4.5.7 binaries
        uses: actions/upload-artifact@v7
        with:
          name: Plane-4.5.7-Cygwin-SITL
          path: artifacts
          retention-days: 7
